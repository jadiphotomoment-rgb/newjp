<body class="bg-background font-body-md text-on-background">

  </button>

    <div class="flex flex-col w-full h-full justify-center items-center">
      <div class="w-full max-w-[1024px] bg-surface-container-lowest rounded-[32px] shadow-sm flex flex-col md:flex-row overflow-hidden relative border border-outline-variant/30">
        <!-- Left Column: Visual Area -->

          <div class="w-full h-full bg-cover bg-center rounded-3xl min-h-[500px]" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCqGxXvu-A-AKP26mS-_oe7IyN9YiL4DWNweBwl44pVHlrrhDtBGDtArI_sMjcjskWMNDehSSLKbLuMKl-BGyZfzh84-HxvjIto8NHjdmBz0yqesoq7FB4NYbt5hwJUqBeZCp1KGwU-FrGLbhV4APy2LLbt1adSN06-XrSdfq-Jg3y_pQJy1YQvV7_Qke3bL2hFCY42P3sgBUJHDH4DshzGVbIw2k0FcVFX3x5O7XY_Cal7OcEfXaB7')"></div>

            <span class="material-symbols-outlined text-primary text-[24px]">photo_save</span>
            <span class="font-label-md text-on-surface tracking-wider uppercase">Jadiphoto.Moment</span>
          </div>
          
          <div class="text-center md:text-left mb-xl">
            <h1 class="font-headline-lg text-on-background mb-sm">Panel Admin</h1>
            <p class="font-body-md text-on-surface-variant">Silakan login untuk melanjutkan</p>
          </div>

          <form class="flex flex-col gap-lg w-full" id="login-form" novalidate>
            <div id="login-alert" class="alert alert-error hidden w-full bg-error-container text-on-error-container p-sm rounded text-sm mb-2" role="alert" aria-live="polite"></div>

            <!-- Username Input -->
            <div class="relative group">
              <label for="username" class="font-label-md text-on-surface-variant absolute -top-3 left-0 bg-surface-container-lowest px-1 transition-all group-focus-within:text-primary z-10">Username</label>
              <input class="w-full bg-transparent border-b border-outline-variant py-sm text-body-lg text-on-background focus:outline-none focus:border-primary transition-colors pb-sm relative z-0" 
                     type="text" id="username" name="username" placeholder="Masukkan username admin" autocomplete="username" required autofocus />
            </div>

            <!-- Password Input -->
            <div class="relative group mt-sm">
              <label for="password" class="font-label-md text-on-surface-variant absolute -top-3 left-0 bg-surface-container-lowest px-1 transition-all group-focus-within:text-primary z-10">Password</label>
              <input class="w-full bg-transparent border-b border-outline-variant py-sm text-body-lg text-on-background focus:outline-none focus:border-primary transition-colors pb-sm relative z-0" 
                     type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required />
              <button class="absolute right-0 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors z-10" 
                      type="button" id="toggle-password" aria-label="Tampilkan password">
                <span class="material-symbols-outlined text-[20px]">visibility_off</span>
              </button>
            </div>

            <!-- Primary Action -->
            <button class="w-full bg-primary hover:opacity-90 text-white font-label-md py-[14px] rounded-lg transition-opacity mt-md flex justify-center items-center gap-2" 
                    type="submit" id="btn-login">
              <span id="btn-login-text">Masuk</span>
              <div id="btn-login-spinner" class="spinner hidden border-2 border-white border-t-transparent rounded-full w-4 h-4 animate-spin" aria-hidden="true"></div>

        </div>
